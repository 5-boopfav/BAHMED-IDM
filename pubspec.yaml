import 'package:flutter/material.dart';
import 'package:flutter/services.dart';
import 'package:background_downloader/background_downloader.dart';

final FileDownloader downloader = FileDownloader();

Future<void> main() async {
  WidgetsFlutterBinding.ensureInitialized();

  await downloader.start(autoCleanDatabase: true);

  downloader.configureNotification(
    running: const TaskNotification(
      'BAHMED IDM',
      'جارٍ تنزيل {filename}',
    ),
    complete: const TaskNotification(
      'اكتمل التنزيل',
      '{filename}',
    ),
    error: const TaskNotification(
      'تعذر التنزيل',
      '{filename}',
    ),
    progressBar: true,
    tapOpensFile: true,
  );

  await downloader.transfers.rehydrateFromDatabase();

  runApp(const BahmedIDM());
}

class BahmedIDM extends StatefulWidget {
  const BahmedIDM({super.key});

  @override
  State<BahmedIDM> createState() => _BahmedIDMState();
}

class _BahmedIDMState extends State<BahmedIDM> {
  ThemeMode themeMode = ThemeMode.dark;

  ThemeData makeTheme(Brightness brightness) {
    final dark = brightness == Brightness.dark;
    const neon = Color(0xFF00E5FF);

    return ThemeData(
      useMaterial3: true,
      brightness: brightness,
      colorScheme: ColorScheme.fromSeed(
        seedColor: neon,
        brightness: brightness,
        surface: dark
            ? const Color(0xFF121827)
            : Colors.white,
      ),
      scaffoldBackgroundColor: dark
          ? const Color(0xFF080D17)
          : const Color(0xFFF2F5FA),
      appBarTheme: AppBarTheme(
        backgroundColor: dark
            ? const Color(0xFF080D17)
            : Colors.white,
        foregroundColor: dark
            ? Colors.white
            : const Color(0xFF172033),
        elevation: 0,
      ),
      cardTheme: CardThemeData(
        elevation: 0,
        color: dark
            ? const Color(0xFF121827)
            : Colors.white,
        shape: RoundedRectangleBorder(
          borderRadius: BorderRadius.circular(18),
        ),
      ),
      inputDecorationTheme: InputDecorationTheme(
        filled: true,
        fillColor: dark
            ? const Color(0xFF1A2435)
            : const Color(0xFFF4F6FA),
        border: OutlineInputBorder(
          borderRadius: BorderRadius.circular(14),
          borderSide: BorderSide.none,
        ),
      ),
    );
  }

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: 'BAHMED IDM',
      theme: makeTheme(Brightness.light),
      darkTheme: makeTheme(Brightness.dark),
      themeMode: themeMode,
      home: HomePage(
        onToggleTheme: () {
          setState(() {
            themeMode = themeMode == ThemeMode.dark
                ? ThemeMode.light
                : ThemeMode.dark;
          });
        },
        isDark: themeMode != ThemeMode.light,
      ),
    );
  }
}

class HomePage extends StatefulWidget {
  const HomePage({
    super.key,
    required this.onToggleTheme,
    required this.isDark,
  });

  final VoidCallback onToggleTheme;
  final bool isDark;

  @override
  State<HomePage> createState() => _HomePageState();
}

class _HomePageState extends State<HomePage> {
  int tab = 0;

  final urlController = TextEditingController();
  final nameController = TextEditingController();

  bool adding = false;
  int chunks = 4;
  String? error;

  Transfers get transfers => downloader.transfers;

  @override
  void dispose() {
    urlController.dispose();
    nameController.dispose();
    super.dispose();
  }

  String filenameFrom(Uri uri) {
    final last = uri.pathSegments.isEmpty
        ? ''
        : Uri.decodeComponent(uri.pathSegments.last);

    final candidate = nameController.text.trim().isNotEmpty
        ? nameController.text.trim()
        : last;

    final safe = candidate
        .replaceAll(
          RegExp(r'[\\/:*?"<>|\u0000-\u001F]'),
          '_',
        )
        .trim();

    return safe.isEmpty
        ? 'bahmed_${DateTime.now().millisecondsSinceEpoch}.bin'
        : safe;
  }

  Future<void> startDownload() async {
    final raw = urlController.text.trim();
    final uri = Uri.tryParse(raw);

    if (uri == null ||
        !uri.hasAuthority ||
        !['http', 'https'].contains(uri.scheme)) {
      setState(() {
        error = 'الرابط غير صالح. أدخل رابط HTTP أو HTTPS.';
      });
      return;
    }

    setState(() {
      adding = true;
      error = null;
    });

    try {
      final task = ParallelDownloadTask(
        url: uri.toString(),
        filename: filenameFrom(uri),
        chunks: chunks,
        baseDirectory: BaseDirectory.applicationDocuments,
        directory: 'BAHMED_IDM',
        updates: Updates.statusAndProgress,
        allowPause: true,
        retries: 3,
        priority: 3,
        transferHints: {
          TransferHint.userInitiated,
          TransferHint.largeFile,
        },
        stallTimeout: const Duration(minutes: 2),
      );

      await transfers.start(task);

      urlController.clear();
      nameController.clear();

      if (mounted) {
        Navigator.of(context).pop();
      }
    } catch (e) {
      setState(() {
        error = 'تعذر بدء التنزيل: $e';
      });
    } finally {
      if (mounted) {
        setState(() {
          adding = false;
        });
      }
    }
  }

  Future<void> showAddDialog() async {
    error = null;

    await showDialog<void>(
      context: context,
      builder: (dialogContext) => StatefulBuilder(
        builder: (context, refresh) => AlertDialog(
          title: const Text('إضافة تنزيل'),
          content: SingleChildScrollView(
            child: Column(
              mainAxisSize: MainAxisSize.min,
              children: [
                TextField(
                  controller: urlController,
                  keyboardType: TextInputType.url,
                  autofocus: true,
                  decoration: const InputDecoration(
                    labelText: 'رابط الملف أو التنزيل',
                    hintText: 'https://example.com/file.zip',
                    prefixIcon: Icon(Icons.link),
                  ),
                ),
                const SizedBox(height: 12),
                TextField(
                  controller: nameController,
                  decoration: const InputDecoration(
                    labelText: 'اسم الملف (اختياري)',
                    prefixIcon: Icon(
                      Icons.drive_file_rename_outline,
                    ),
                  ),
                ),
                const SizedBox(height: 14),
                Row(
                  children: [
                    const Expanded(
                      child: Text('عدد الاتصالات المتوازية'),
                    ),
                    DropdownButton<int>(
                      value: chunks,
                      items: const [2, 4, 6, 8]
                          .map(
                            (v) => DropdownMenuItem(
                              value: v,
                              child: Text('$v'),
                            ),
                          )
                          .toList(),
                      onChanged: (v) {
                        refresh(() {
                          chunks = v ?? 4;
                        });
                      },
                    ),
                  ],
                ),
                if (error != null) ...[
                  const SizedBox(height: 8),
                  Text(
                    error!,
                    style: TextStyle(
                      color: Theme.of(context).colorScheme.error,
                    ),
                  ),
                ],
              ],
            ),
          ),
          actions: [
            TextButton(
              onPressed: adding
                  ? null
                  : () => Navigator.pop(dialogContext),
              child: const Text('إلغاء'),
            ),
            FilledButton.icon(
              onPressed: adding
                  ? null
                  : () async {
                      refresh(() {});
                      await startDownload();

                      if (mounted) {
                        refresh(() {});
                      }
                    },
              icon: adding
                  ? const SizedBox(
                      width: 16,
                      height: 16,
                      child: CircularProgressIndicator(
                        strokeWidth: 2,
                      ),
                    )
                  : const Icon(Icons.download),
              label: const Text('ابدأ'),
            ),
          ],
        ),
      ),
    );
  }

  Future<void> pasteLink() async {
    final data = await Clipboard.getData(
      Clipboard.kTextPlain,
    );

    if (data?.text != null &&
        data!.text!.trim().isNotEmpty) {
      urlController.text = data.text!.trim();
    }

    await showAddDialog();
  }

  @override
  Widget build(BuildContext context) {
    return Directionality(
      textDirection: TextDirection.rtl,
      child: Scaffold(
        appBar: AppBar(
          title: const Column(
            crossAxisAlignment: CrossAxisAlignment.start,
            children: [
              Text(
                'BAHMED IDM',
                style: TextStyle(
                  fontWeight: FontWeight.w900,
                  letterSpacing: 1,
                ),
              ),
              Text(
                'مدير التنزيلات',
                style: TextStyle(
                  fontSize: 12,
                  fontWeight: FontWeight.normal,
                ),
              ),
            ],
          ),
          actions: [
            IconButton(
              tooltip: 'تغيير المظهر',
              onPressed: widget.onToggleTheme,
              icon: Icon(
                widget.isDark
                    ? Icons.light_mode
                    : Icons.dark_mode,
              ),
            ),
            IconButton(
              tooltip: 'إضافة رابط',
              onPressed: showAddDialog,
              icon: const Icon(Icons.add_link),
            ),
          ],
        ),
        body: tab == 0
            ? downloadsView()
            : settingsView(),
        floatingActionButton: tab == 0
            ? FloatingActionButton.extended(
                onPressed: pasteLink,
                icon: const Icon(Icons.add),
                label: const Text('تنزيل جديد'),
              )
            : null,
        bottomNavigationBar: NavigationBar(
          selectedIndex: tab,
          onDestinationSelected: (v) {
            setState(() {
              tab = v;
            });
          },
          destinations: const [
            NavigationDestination(
              icon: Icon(Icons.download_for_offline_outlined),
              selectedIcon: Icon(Icons.download_for_offline),
              label: 'التنزيلات',
            ),
            NavigationDestination(
              icon: Icon(Icons.settings_outlined),
              selectedIcon: Icon(Icons.settings),
              label: 'الإعدادات',
            ),
          ],
        ),
      ),
    );
  }

  Widget downloadsView() {
    return ValueListenableBuilder<List<Transfer>>(
      valueListenable: transfers.notifier,
      builder: (context, items, _) {
        final active = items
            .where((t) => !t.status.isFinalState)
            .length;

        if (items.isEmpty) {
          return const EmptyDownloads();
        }

        return Column(
          children: [
            Padding(
              padding: const EdgeInsets.fromLTRB(16, 12, 16, 4),
              child: Row(
                children: [
                  Expanded(
                    child: _summary(
                      'كل التنزيلات',
                      '${items.length}',
                      Icons.folder_outlined,
                    ),
                  ),
                  const SizedBox(width: 8),
                  Expanded(
                    child: _summary(
                      'النشطة',
                      '$active',
                      Icons.downloading,
                    ),
                  ),
                ],
              ),
            ),
            Expanded(
              child: ListView.separated(
                padding: const EdgeInsets.fromLTRB(
                  14,
                  10,
                  14,
                  90,
                ),
                itemCount: items.length,
                separatorBuilder: (_, __) =>
                    const SizedBox(height: 9),
                itemBuilder: (_, i) => TransferCard(
                  key: ValueKey(items[i].taskId),
                  transfer: items[i],
                ),
              ),
            ),
          ],
        );
      },
    );
  }

  Widget _summary(
    String title,
    String value,
    IconData icon,
  ) {
    return Card(
      child: Padding(
        padding: const EdgeInsets.all(13),
        child: Row(
          children: [
            Icon(
              icon,
              color: const Color(0xFF00BCD4),
            ),
            const SizedBox(width: 10),
            Expanded(
              child: Text(
                title,
                style: const TextStyle(fontSize: 12),
              ),
            ),
            Text(
              value,
              style: const TextStyle(
                fontWeight: FontWeight.bold,
                fontSize: 18,
              ),
            ),
          ],
        ),
      ),
    );
  }

  Widget settingsView() {
    return ListView(
      padding: const EdgeInsets.all(16),
      children: const [
        ListTile(
          leading: Icon(Icons.speed),
          title: Text('التنزيل المتوازي'),
          subtitle: Text(
            'يستخدم التطبيق 4 أجزاء افتراضياً، '
            'ويمكن تغيير العدد عند إضافة رابط.',
          ),
        ),
        ListTile(
          leading: Icon(Icons.pause_circle_outline),
          title: Text('الإيقاف والاستئناف'),
          subtitle: Text(
            'يعتمد الاستكمال على دعم الخادم لطلبات Range '
            'وحفظ بيانات الاستكمال.',
          ),
        ),
        ListTile(
          leading: Icon(Icons.folder_open),
          title: Text('مكان الحفظ'),
          subtitle: Text(
            'داخل مساحة التطبيق: BAHMED_IDM.',
          ),
        ),
        ListTile(
          leading: Icon(Icons.info_outline),
          title: Text('دعم الروابط'),
          subtitle: Text(
            'روابط الملفات المباشرة HTTP وHTTPS. '
            'روابط صفحات التواصل تحتاج استخراج رابط '
            'الوسائط المسموح به من المنصة، '
            'وليست كل صفحة رابط ملف مباشر.',
          ),
        ),
      ],
    );
  }
}

