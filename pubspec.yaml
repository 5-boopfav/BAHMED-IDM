name: bahmed_idm
description: BAHMED IDM - Advanced Download Manager
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  background_downloader: ^9.6.6
  shared_preferences: ^2.5.6
  material_ui: ^1.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
              tooltip: 'إضافة رابط',
              onPressed: showAddDialog,
              icon: const Icon(Icons.add_link),
            ),
          ],
        ),
        body: tab == 0
            ? downloadsView()
            : settingsView(),
        floatingActionButton: tab == 0
            ? FloatingActionButton.extended(
                onPressed: pasteLink,
                icon: const Icon(Icons.add),
                label: const Text('تنزيل جديد'),
              )
            : null,
        bottomNavigationBar: NavigationBar(
          selectedIndex: tab,
          onDestinationSelected: (v) {
            setState(() {
              tab = v;
            });
          },
          destinations: const [
            NavigationDestination(
              icon: Icon(Icons.download_for_offline_outlined),
              selectedIcon: Icon(Icons.download_for_offline),
              label: 'التنزيلات',
            ),
            NavigationDestination(
              icon: Icon(Icons.settings_outlined),
              selectedIcon: Icon(Icons.settings),
              label: 'الإعدادات',
            ),
          ],
        ),
      ),
    );
  }

  Widget downloadsView() {
    return ValueListenableBuilder<List<Transfer>>(
      valueListenable: transfers.notifier,
      builder: (context, items, _) {
        final active = items
            .where((t) => !t.status.isFinalState)
            .length;

        if (items.isEmpty) {
          return const EmptyDownloads();
        }

        return Column(
          children: [
            Padding(
              padding: const EdgeInsets.fromLTRB(16, 12, 16, 4),
              child: Row(
                children: [
                  Expanded(
                    child: _summary(
                      'كل التنزيلات',
                      '${items.length}',
                      Icons.folder_outlined,
                    ),
                  ),
                  const SizedBox(width: 8),
                  Expanded(
                    child: _summary(
                      'النشطة',
                      '$active',
                      Icons.downloading,
                    ),
                  ),
                ],
              ),
            ),
            Expanded(
              child: ListView.separated(
                padding: const EdgeInsets.fromLTRB(
                  14,
                  10,
                  14,
                  90,
                ),
                itemCount: items.length,
                separatorBuilder: (_, __) =>
                    const SizedBox(height: 9),
                itemBuilder: (_, i) => TransferCard(
                  key: ValueKey(items[i].taskId),
                  transfer: items[i],
                ),
              ),
            ),
          ],
        );
      },
    );
  }

  Widget _summary(
    String title,
    String value,
    IconData icon,
  ) {
    return Card(
      child: Padding(
        padding: const EdgeInsets.all(13),
        child: Row(
          children: [
            Icon(
              icon,
              color: const Color(0xFF00BCD4),
            ),
            const SizedBox(width: 10),
            Expanded(
              child: Text(
                title,
                style: const TextStyle(fontSize: 12),
              ),
            ),
            Text(
              value,
              style: const TextStyle(
                fontWeight: FontWeight.bold,
                fontSize: 18,
              ),
            ),
          ],
        ),
      ),
    );
  }

  Widget settingsView() {
    return ListView(
      padding: const EdgeInsets.all(16),
      children: const [
        ListTile(
          leading: Icon(Icons.speed),
          title: Text('التنزيل المتوازي'),
          subtitle: Text(
            'يستخدم التطبيق 4 أجزاء افتراضياً، '
            'ويمكن تغيير العدد عند إضافة رابط.',
          ),
        ),
        ListTile(
          leading: Icon(Icons.pause_circle_outline),
          title: Text('الإيقاف والاستئناف'),
          subtitle: Text(
            'يعتمد الاستكمال على دعم الخادم لطلبات Range '
            'وحفظ بيانات الاستكمال.',
          ),
        ),
        ListTile(
          leading: Icon(Icons.folder_open),
          title: Text('مكان الحفظ'),
          subtitle: Text(
            'داخل مساحة التطبيق: BAHMED_IDM.',
          ),
        ),
        ListTile(
          leading: Icon(Icons.info_outline),
          title: Text('دعم الروابط'),
          subtitle: Text(
            'روابط الملفات المباشرة HTTP وHTTPS. '
            'روابط صفحات التواصل تحتاج استخراج رابط '
            'الوسائط المسموح به من المنصة، '
            'وليست كل صفحة رابط ملف مباشر.',
          ),
        ),
      ],
    );
  }
}

class EmptyDownloads extends StatelessWidget {
  const EmptyDownloads({super.key});

  @override
  Widget build(BuildContext context) {
    return Center(
      child: Padding(
        padding: const EdgeInsets.all(28),
        child: Column(
          mainAxisSize: MainAxisSize.min,
          children: [
            const Icon(
              Icons.cloud_download_outlined,
              size: 78,
              color: Color(0xFF00BCD4),
            ),
            const SizedBox(height: 18),
            const Text(
              'لا توجد تنزيلات بعد',
              style: TextStyle(
                fontSize: 20,
                fontWeight: FontWeight.bold,
              ),
            ),
            const SizedBox(height: 8),
            Text(
              'أضف رابط ملف مباشر لبدء التنزيل.',
              textAlign: TextAlign.center,
              style: TextStyle(
                color: Theme.of(context)
                    .textTheme
                    .bodySmall
                    ?.color,
              ),
            ),
          ],
        ),
      ),
    );
  }
}

class TransferCard extends StatelessWidget {
  const TransferCard({
    super.key,
    required this.transfer,
  });

  final Transfer transfer;

  String statusText(TaskStatus status) {
    switch (status) {
      case TaskStatus.enqueued:
        return 'في قائمة الانتظار';
      case TaskStatus.running:
        return 'جارٍ التنزيل';
      case TaskStatus.complete:
        return 'اكتمل التنزيل';
      case TaskStatus.failed:
        return 'فشل التنزيل';
      case TaskStatus.canceled:
        return 'تم الإلغاء';
      case TaskStatus.paused:
        return 'متوقف مؤقتاً';
      case TaskStatus.waitingToRetry:
        return 'إعادة المحاولة تلقائياً';
      default:
        return status.name;
    }
  }

  String sizeText(double? progress) {
    return progress == null
        ? 'الحجم غير معروف'
        : '${(progress * 100).toStringAsFixed(1)}%';
  }

  String speedText(double value) {
    if (value < 0) return '—';

    if (value < 1) {
      return '${(value * 1024).toStringAsFixed(0)} KB/s';
    }

    return '${value.toStringAsFixed(2)} MB/s';
  }

  String timeText(Duration d) {
    if (d.inSeconds <= 0) return '—';

    return '${d.inHours > 0 ? '${d.inHours} س ' : ''}'
        '${d.inMinutes.remainder(60)} د '
        '${d.inSeconds.remainder(60)} ث';
  }

  @override
  Widget build(BuildContext context) {
    return Card(
      child: Padding(
        padding: const EdgeInsets.all(14),
        child: Column(
          crossAxisAlignment: CrossAxisAlignment.start,
          children: [
            Row(
              children: [
                const Icon(
                  Icons.insert_drive_file_outlined,
                  color: Color(0xFF00BCD4),
                ),
                const SizedBox(width: 9),
                Expanded(
                  child: Text(
                    transfer.task.filename,
                    maxLines: 1,
                    overflow: TextOverflow.ellipsis,
                    style: const TextStyle(
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                ),
                PopupMenuButton<String>(
                  onSelected: (v) async {
                    if (v == 'pause') {
                      await transfer.pause();
                    }

                    if (v == 'resume') {
                      await transfer.resume();
                    }

                    if (v == 'cancel') {
                      await transfer.cancel();
                    }

                    if (v == 'remove') {
                      await transfer.cancel();
                      downloader.transfers.remove(
                        transfer.taskId,
                      );
                    }
                  },
                  itemBuilder: (_) => const [
                    PopupMenuItem(
                      value: 'pause',
                      child: Text('إيقاف مؤقت'),
                    ),
                    PopupMenuItem(
                      value: 'resume',
                      child: Text('استئناف'),
                    ),
                    PopupMenuItem(
                      value: 'cancel',
                      child: Text('إلغاء'),
                    ),
                    PopupMenuItem(
                      value: 'remove',
                      child: Text('إزالة من القائمة'),
                    ),
                  ],
                ),
              ],
            ),
            const SizedBox(height: 9),
            ValueListenableBuilder<TaskStatus>(
              valueListenable: transfer.statusNotifier,
              builder: (context, status, _) {
                return Row(
                  children: [
                    Expanded(
                      child: Text(
                        statusText(status),
                        style: Theme.of(context)
                            .textTheme
                            .bodySmall,
                      ),
                    ),
                    if (status == TaskStatus.failed)
                      const Icon(
                        Icons.error_outline,
                        color: Colors.red,
                        size: 18,
                      ),
                    if (status == TaskStatus.complete)
                      const Icon(
                        Icons.check_circle,
                        color: Colors.green,
                        size: 18,
                      ),
                  ],
                );
              },
            ),
            const SizedBox(height: 10),
            ValueListenableBuilder<double?>(
              valueListenable: transfer.progressNotifier,
              builder: (context, p, _) {
                return Column(
                  crossAxisAlignment:
                      CrossAxisAlignment.stretch,
                  children: [
                    LinearProgressIndicator(
                      value: p,
                      minHeight: 8,
                      borderRadius: BorderRadius.circular(8),
                    ),
                    const SizedBox(height: 6),
                    Row(
                      children: [
                        Expanded(
                          child: Text(
                            sizeText(p),
                            style: Theme.of(context)
                                .textTheme
                                .bodySmall,
                          ),
                        ),
                        Text(
                          p == null
                              ? '...'
                              : '${(p * 100).toStringAsFixed(1)}%',
                          style: const TextStyle(
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                      ],
                    ),
                  ],
                );
              },
            ),
            const SizedBox(height: 8),
            Row(
              children: [
                Expanded(
                  child: ValueListenableBuilder<double>(
                    valueListenable:
                        transfer.networkSpeedNotifier,
                    builder: (_, v, __) {
                      return _metric(
                        Icons.speed,
                        speedText(v),
                      );
                    },
                  ),
                ),
                Expanded(
                  child: ValueListenableBuilder<Duration>(
                    valueListenable:
                        transfer.timeRemainingNotifier,
                    builder: (_, v, __) {
                      return _metric(
                        Icons.timer_outlined,
                        timeText(v),
                      );
                    },
                  ),
                ),
              ],
            ),
            const SizedBox(height: 8),
            ValueListenableBuilder<TaskStatus>(
              valueListenable: transfer.statusNotifier,
              builder: (context, status, _) {
                return Wrap(
                  spacing: 8,
                  runSpacing: 4,
                  children: [
                    if (status == TaskStatus.running ||
                        status == TaskStatus.enqueued ||
                        status == TaskStatus.waitingToRetry)
                      OutlinedButton.icon(
                        onPressed: () => transfer.pause(),
                        icon: const Icon(
                          Icons.pause,
                          size: 18,
                        ),
                        label: const Text('إيقاف'),
                      ),
                    if (status == TaskStatus.paused ||
                        status == TaskStatus.failed)
                      FilledButton.tonalIcon(
                        onPressed: () => transfer.resume(),
                        icon: const Icon(
                          Icons.play_arrow,
                          size: 18,
                        ),
                        label: const Text('استئناف'),
                      ),
                    if (!status.isFinalState)
                      TextButton.icon(
                        onPressed: () => transfer.cancel(),
                        icon: const Icon(
                          Icons.close,
                          size: 18,
                        ),
                        label: const Text('إلغاء'),
                      ),
                  ],
                );
              },
            ),
          ],
        ),
      ),
    );
  }

  Widget _metric(IconData icon, String text) {
    return Row(
      children: [
        Icon(
          icon,
          size: 15,
          color: const Color(0xFF00BCD4),
        ),
        const SizedBox(width: 5),
        Flexible(
          child: Text(
            text,
            maxLines: 1,
            overflow: TextOverflow.ellipsis,
            style: const TextStyle(fontSize: 12),
          ),
        ),
      ],
    );
  }
}
