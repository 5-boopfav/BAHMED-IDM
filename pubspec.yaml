class TransferCard extends StatelessWidget {
  const TransferCard({
    super.key,
    required this.transfer,
  });

  final Transfer transfer;

  String statusText(TaskStatus status) {
    switch (status) {
      case TaskStatus.enqueued:
        return 'في قائمة الانتظار';
      case TaskStatus.running:
        return 'جارٍ التنزيل';
      case TaskStatus.complete:
        return 'اكتمل التنزيل';
      case TaskStatus.failed:
        return 'فشل التنزيل';
      case TaskStatus.canceled:
        return 'تم الإلغاء';
      case TaskStatus.paused:
        return 'متوقف مؤقتاً';
      case TaskStatus.waitingToRetry:
        return 'إعادة المحاولة تلقائياً';
      default:
        return status.name;
    }
  }

  String sizeText(double? progress) {
    return progress == null
        ? 'الحجم غير معروف'
        : '${(progress * 100).toStringAsFixed(1)}%';
  }

  String speedText(double value) {
    if (value < 0) return '—';

    if (value < 1) {
      return '${(value * 1024).toStringAsFixed(0)} KB/s';
    }

    return '${value.toStringAsFixed(2)} MB/s';
  }

  String timeText(Duration d) {
    if (d.inSeconds <= 0) return '—';

    return '${d.inHours > 0 ? '${d.inHours} س ' : ''}'
        '${d.inMinutes.remainder(60)} د '
        '${d.inSeconds.remainder(60)} ث';
  }

  @override
  Widget build(BuildContext context) {
    return Card(
      child: Padding(
        padding: const EdgeInsets.all(14),
        child: Column(
          crossAxisAlignment: CrossAxisAlignment.start,
          children: [
            Row(
              children: [
                const Icon(
                  Icons.insert_drive_file_outlined,
                  color: Color(0xFF00BCD4),
                ),
                const SizedBox(width: 9),
                Expanded(
                  child: Text(
                    transfer.task.filename,
                    maxLines: 1,
                    overflow: TextOverflow.ellipsis,
                    style: const TextStyle(
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                ),
                PopupMenuButton<String>(
                  onSelected: (v) async {
                    if (v == 'pause') {
                      await transfer.pause();
                    }

                    if (v == 'resume') {
                      await transfer.resume();
                    }

                    if (v == 'cancel') {
                      await transfer.cancel();
                    }

                    if (v == 'remove') {
                      await transfer.cancel();
                      downloader.transfers.remove(
                        transfer.taskId,
                      );
                    }
                  },
                  itemBuilder: (_) => const [
                    PopupMenuItem(
                      value: 'pause',
                      child: Text('إيقاف مؤقت'),
                    ),
                    PopupMenuItem(
                      value: 'resume',
                      child: Text('استئناف'),
                    ),
                    PopupMenuItem(
                      value: 'cancel',
                      child: Text('إلغاء'),
                    ),
                    PopupMenuItem(
                      value: 'remove',
                      child: Text('إزالة من القائمة'),
                    ),
                  ],
                ),
              ],
            ),
            const SizedBox(height: 9),
            ValueListenableBuilder<TaskStatus>(
              valueListenable: transfer.statusNotifier,
              builder: (context, status, _) {
                return Row(
                  children: [
                    Expanded(
                      child: Text(
                        statusText(status),
                        style: Theme.of(context)
                            .textTheme
                            .bodySmall,
                      ),
                    ),
                    if (status == TaskStatus.failed)
                      const Icon(
                        Icons.error_outline,
                        color: Colors.red,
                        size: 18,
                      ),
                    if (status == TaskStatus.complete)
                      const Icon(
                        Icons.check_circle,
                        color: Colors.green,
                        size: 18,
                      ),
                  ],
                );
              },
            ),
            const SizedBox(height: 10),
            ValueListenableBuilder<double?>(
              valueListenable: transfer.progressNotifier,
              builder: (context, p, _) {
                return Column(
                  crossAxisAlignment:
                      CrossAxisAlignment.stretch,
                  children: [
                    LinearProgressIndicator(
                      value: p,
                      minHeight: 8,
                      borderRadius: BorderRadius.circular(8),
                    ),
                    const SizedBox(height: 6),
                    Row(
                      children: [
                        Expanded(
                          child: Text(
                            sizeText(p),
                            style: Theme.of(context)
                                .textTheme
                                .bodySmall,
                          ),
                        ),
                        Text(
                          p == null
                              ? '...'
                              : '${(p * 100).toStringAsFixed(1)}%',
                          style: const TextStyle(
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                      ],
                    ),
                  ],
                );
              },
            ),
            const SizedBox(height: 8),
            Row(
              children: [
                Expanded(
                  child: ValueListenableBuilder<double>(
                    valueListenable:
                        transfer.networkSpeedNotifier,
                    builder: (_, v, __) {
                      return _metric(
                        Icons.speed,
                        speedText(v),
                      );
                    },
                  ),
                ),
                Expanded(
                  child: ValueListenableBuilder<Duration>(
                    valueListenable:
                        transfer.timeRemainingNotifier,
                    builder: (_, v, __) {
                      return _metric(
                        Icons.timer_outlined,
                        timeText(v),
                      );
                    },
                  ),
                ),
              ],
            ),
            const SizedBox(height: 8),
            ValueListenableBuilder<TaskStatus>(
              valueListenable: transfer.statusNotifier,
              builder: (context, status, _) {
                return Wrap(
                  spacing: 8,
                  runSpacing: 4,
                  children: [
                    if (status == TaskStatus.running ||
                        status == TaskStatus.enqueued ||
                        status == TaskStatus.waitingToRetry)
                      OutlinedButton.icon(
                        onPressed: () => transfer.pause(),
                        icon: const Icon(
                          Icons.pause,
                          size: 18,
                        ),
                        label: const Text('إيقاف'),
                      ),
                    if (status == TaskStatus.paused ||
                        status == TaskStatus.failed)
                      FilledButton.tonalIcon(
                        onPressed: () => transfer.resume(),
                        icon: const Icon(
                          Icons.play_arrow,
                          size: 18,
                        ),
                        label: const Text('استئناف'),
                      ),
                    if (!status.isFinalState)
                      TextButton.icon(
                        onPressed: () => transfer.cancel(),
                        icon: const Icon(
                          Icons.close,
                          size: 18,
                        ),
                        label: const Text('إلغاء'),
                      ),
                  ],
                );
              },
            ),
          ],
        ),
      ),
    );
  }

  Widget _metric(IconData icon, String text) {
    return Row(
      children: [
        Icon(
          icon,
          size: 15,
          color: const Color(0xFF00BCD4),
        ),
        const SizedBox(width: 5),
        Flexible(
          child: Text(
            text,
            maxLines: 1,
            overflow: TextOverflow.ellipsis,
            style: const TextStyle(fontSize: 12),
          ),
        ),
      ],
    );
  }
}
